location = /raidman {
    return 301 /raidman/;
}

location ^~ /raidman/ {
    # Every request is authenticated by the RaidMan daemon with an Unraid API
    # key, so the webGUI login is not required here.
    allow all;
    proxy_pass http://127.0.0.1:9876/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Host as the client sent it (with port): the daemon compares it with the
    # Origin of cookie-authenticated (noVNC) requests.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    # Literal value (as in every earlier release): it needs no map, so the
    # snippet passes nginx -t on every supported Unraid version.
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The scheme a reverse proxy or tunnel in front of Unraid (for example
    # Cloudflare) saw. Only used to mark the noVNC session cookie Secure.
    proxy_set_header X-Raidman-Client-Proto $http_x_forwarded_proto;
    proxy_set_header x-api-key $http_x_api_key;
    proxy_set_header Cookie $http_cookie;
    # Terminal, VNC, log and stats WebSockets can be idle for a long time;
    # nginx's 60s default would cut them.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
