version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps the SHA-pinned actions in .github/workflows current (the version
  # comment next to each pin is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
